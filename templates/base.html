<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}物流拍照提醒站{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename=ui_css_file) }}?v={{ ui_build_id }}">
</head>
<body>
  <div class="aurora aurora-one"></div>
  <div class="aurora aurora-two"></div>

  <header class="site-header rise-in">
    <div class="brand-block">
      <p class="brand-kicker">Logistics Mesh</p>
      <h1 class="brand-title">快递拍照日志与尾号提醒</h1>
    </div>
    <nav class="site-nav">
      <a href="{{ url_for('index') }}">首页</a>
      {% if is_super_admin %}
        <a href="{{ url_for('admin_dashboard') }}">管理后台</a>
      {% endif %}
    </nav>
  </header>

  <main class="page-shell">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <section class="flash-stack" aria-live="polite">
          {% for category, message in messages %}
            <article class="flash-card flash-{{ category }}">{{ message }}</article>
          {% endfor %}
        </section>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename=ui_js_file) }}?v={{ ui_build_id }}" defer></script>
</body>
</html>
