{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block content %}
<section class="card auth-card">
  <h2>注册</h2>
  <form method="post" class="form">
    <label>
      用户名
      <input type="text" name="username" minlength="2" required autocomplete="username">
    </label>
    <label>
      密码
      <input type="password" name="password" minlength="4" required autocomplete="new-password">
    </label>
    <button type="submit">注册并登录</button>
  </form>
  <p class="muted">已有账号？<a href="{{ url_for('login') }}">去登录</a></p>
</section>
{% endblock %}
